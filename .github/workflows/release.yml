name: Build Home Assistant app

on:
  repository_dispatch:
    types:
      - release-built
  workflow_dispatch:
    inputs:
      version:
        description: Pulse2MQTT version
        required: true
        type: string
      tag:
        description: Pulse2MQTT release tag, for example v0.5.0
        required: true
        default: v0.5.0
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: app-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

env:
  APP_IMAGE_DOCKERHUB: docker.io/${{ vars.DOCKERHUB_USERNAME }}/app-pulse2mqtt
  APP_IMAGE_GHCR: ghcr.io/snislab/app-pulse2mqtt
  SOURCE_REPOSITORY: SnisLab/pulse2mqtt

jobs:
  release:
    name: Publish app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine build inputs
        id: release
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.client_payload.tag }}
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${EVENT_VERSION:-${INPUT_VERSION}}"
          tag="${EVENT_TAG:-${INPUT_TAG}}"
          test -n "${version}"
          test -n "${tag}"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+){2,3}([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "${tag}" == v* ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "channel=latest" >> "${GITHUB_OUTPUT}"

      - name: Import application changelog
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${SOURCE_REPOSITORY}/${RELEASE_TAG}/CHANGELOG.md"
          curl --fail --location --retry 3 "${url}" --output CHANGELOG.md

      - name: Update app version
        id: app-version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" config.yaml
          if git diff --quiet -- config.yaml CHANGELOG.md; then
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml CHANGELOG.md
          git commit -m "Update Home Assistant app version to ${VERSION}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Download Pulse2MQTT APKs
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p packages/amd64 packages/arm64
          for arch in amd64 arm64; do
            package="pulse2mqtt_linux_${arch}.apk"
            url="https://github.com/${SOURCE_REPOSITORY}/releases/download/${RELEASE_TAG}/${package}"
            curl --fail --location --retry 3 "${url}" --output "packages/${arch}/${package}"
          done

      - name: Run Home Assistant app linter
        uses: frenck/action-app-linter@v2
        with:
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish app image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.APP_IMAGE_DOCKERHUB }}:latest
            ${{ env.APP_IMAGE_GHCR }}:latest
            ${{ env.APP_IMAGE_DOCKERHUB }}:${{ steps.release.outputs.version }}
            ${{ env.APP_IMAGE_GHCR }}:${{ steps.release.outputs.version }}

      - name: Update Home Assistant stable catalog
        env:
          GH_TOKEN: ${{ secrets.HOME_ASSISTANT_APPS_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.app-version.outputs.sha }}
          IMAGE: ${{ env.APP_IMAGE_DOCKERHUB }}:${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          gh api --method POST repos/SnisLab/home-assistant-apps/dispatches --input - <<JSON
          {
            "event_type": "app-released",
            "client_payload": {
              "repository": "app-pulse2mqtt",
              "version": "${VERSION}",
              "tag": "v${VERSION}",
              "sha": "${SHA}",
              "image": "${IMAGE}"
            }
          }
          JSON

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/app-pulse2mqtt
          short-description: Home Assistant app for Pulse2MQTT
          readme-filepath: ./README.md
