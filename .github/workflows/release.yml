name: Build Home Assistant app

on:
  repository_dispatch:
    types:
      - release-built
  workflow_dispatch:
    inputs:
      version:
        description: Pulse2MQTT version
        required: true
        type: string
      tag:
        description: Pulse2MQTT release tag, for example v0.5.0 or edge
        required: true
        default: edge
        type: string
      channel:
        description: Image channel to publish
        required: true
        default: edge
        type: choice
        options:
          - edge
          - latest

permissions:
  contents: read
  packages: write

concurrency:
  group: app-${{ github.event.client_payload.version || inputs.version }}-${{ github.event.client_payload.channel || inputs.channel }}
  cancel-in-progress: false

env:
  APP_IMAGE_DOCKERHUB: docker.io/snislab/app-pulse2mqtt
  APP_IMAGE_GHCR: ghcr.io/snislab/app-pulse2mqtt
  SOURCE_REPOSITORY: SnisLab/pulse2mqtt

jobs:
  release:
    name: Publish app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine build inputs
        id: release
        shell: bash
        env:
          EVENT_CHANNEL: ${{ github.event.client_payload.channel }}
          EVENT_TAG: ${{ github.event.client_payload.tag }}
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${EVENT_VERSION:-${INPUT_VERSION}}"
          tag="${EVENT_TAG:-${INPUT_TAG}}"
          channel="${EVENT_CHANNEL:-${INPUT_CHANNEL}}"
          if [[ -z "${channel}" ]]; then
            if [[ "${tag}" == "edge" ]]; then
              channel=edge
            else
              channel=latest
            fi
          fi
          test -n "${version}"
          test -n "${tag}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "${tag}" == "edge" || "${tag}" == v* ]]
          [[ "${channel}" == "edge" || "${channel}" == "latest" ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Download Pulse2MQTT APKs
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p packages/amd64 packages/arm64
          for arch in amd64 arm64; do
            package="pulse2mqtt_linux_${arch}.apk"
            url="https://github.com/${SOURCE_REPOSITORY}/releases/download/${RELEASE_TAG}/${package}"
            curl --fail --location --retry 3 "${url}" --output "packages/${arch}/${package}"
          done

      - name: Run Home Assistant app linter
        uses: frenck/action-app-linter@v2
        with:
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish app image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.APP_IMAGE_DOCKERHUB }}:${{ steps.release.outputs.channel }}
            ${{ env.APP_IMAGE_GHCR }}:${{ steps.release.outputs.channel }}
            ${{ env.APP_IMAGE_DOCKERHUB }}:${{ steps.release.outputs.version }}
            ${{ env.APP_IMAGE_GHCR }}:${{ steps.release.outputs.version }}
