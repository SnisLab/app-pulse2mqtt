name: Release Home Assistant app

on:
  repository_dispatch:
    types:
      - release-built

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.client_payload.version }}
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/snislab/app-pulse2mqtt

jobs:
  release:
    name: Publish app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate release payload
        id: release
        shell: bash
        env:
          IMAGE: ${{ github.event.client_payload.image }}
          SHA: ${{ github.event.client_payload.sha }}
          TAG: ${{ github.event.client_payload.tag }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "${TAG}" == "v${VERSION}" ]]
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE}" == "ghcr.io/snislab/pulse2mqtt:${VERSION}" ]]
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Update app metadata
        shell: bash
        env:
          IMAGE: ${{ github.event.client_payload.image }}
          SHA: ${{ github.event.client_payload.sha }}
          TAG: ${{ github.event.client_payload.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" config.yaml
          jq -n \
            --arg repository "pulse2mqtt" \
            --arg version "${VERSION}" \
            --arg tag "${TAG}" \
            --arg sha "${SHA}" \
            --arg image "${IMAGE}" \
            '{repository: $repository, version: $version, tag: $tag, sha: $sha, image: $image}' \
            > .upstream.json

      - name: Run Home Assistant app linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21
        with:
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.release.outputs.version }}
            PULSE2MQTT_IMAGE=${{ github.event.client_payload.image }}
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.APP_IMAGE }}:latest

      - name: Commit and tag app release
        id: app
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml .upstream.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: release Home Assistant app ${VERSION}"
            git push origin HEAD:main
          fi

          app_sha="$(git rev-parse HEAD)"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v${VERSION}")" = "${app_sha}"
          else
            git tag -a "v${VERSION}" -m "Pulse2MQTT Home Assistant App ${VERSION}"
            git push origin "v${VERSION}"
          fi

          echo "sha=${app_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release view "v${VERSION}" >/dev/null 2>&1 || \
            gh release create "v${VERSION}" --title "Pulse2MQTT App ${VERSION}" --generate-notes

      - name: Update central Home Assistant catalog
        env:
          APP_SHA: ${{ steps.app.outputs.sha }}
          GH_TOKEN: ${{ secrets.HOME_ASSISTANT_APPS_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq -n \
            --arg repository "app-pulse2mqtt" \
            --arg version "${VERSION}" \
            --arg tag "v${VERSION}" \
            --arg sha "${APP_SHA}" \
            --arg image "${APP_IMAGE}:${VERSION}" \
            '{event_type: "app-released", client_payload: {repository: $repository, version: $version, tag: $tag, sha: $sha, image: $image}}' \
            | gh api --method POST repos/SnisLab/home-assistant-apps/dispatches --input -
